[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-hangar-cli"
version = "0.36.0"
description = "Command-line client for Agent Hangar: guided install (setup/doctor), GitOps apply, ship, test, rollback, jobs and API keys."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.scripts]
hangar = "hangar_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["hangar_cli"]
