name: agent-hangar

# Imagens: `docker compose up -d --build` builda a central, o runtime dos agentes e o harness base (mock).
# Harnesses reais são opt-in (imagens grandes):
#   docker compose --profile harness build     # claude-code, codex, deepseek-harness
#   docker compose --profile hermes build      # hermes (instalador próprio, mais lento)
# Ou use as imagens publicadas: HANGAR_REGISTRY=ghcr.io/<owner> + HANGAR_VERSION=<tag>.

x-build-only: &build-only
  command: ["true"]
  restart: "no"
  network_mode: none

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hangar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?rode scripts/setup.sh para gerar o .env}
      POSTGRES_DB: ${POSTGRES_DB:-hangar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hangar}"]
      interval: 3s
      timeout: 3s
      retries: 20
    # rede só da central: agentes (que executam tools e, no Data Studio, Python arbitrário) não alcançam o banco
    networks: [db_net]
    restart: unless-stopped   # sem isto o banco não volta quando o Docker reinicia (e a central fica unhealthy)

  # A central nunca monta o docker.sock: fala com este proxy, que só libera a API de containers
  # (criar/listar/parar/remover/logs), volumes e redes — sem exec, build, pull, images, swarm, secrets.
  # Veja docs/security.md para o que isso protege e o que NÃO protege.
  docker-proxy:
    image: ${DOCKER_PROXY_IMAGE:-tecnativa/docker-socket-proxy:v0.4.1}
    environment:
      CONTAINERS: 1
      POST: 1
      DELETE: 1
      NETWORKS: 1
      VOLUMES: 1
      IMAGES: 0
      EXEC: 0
      BUILD: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker_api]
    restart: unless-stopped

  # --- imagens (build-only: o container só existe para o compose buildar a imagem) ---
  agent-runtime:
    <<: *build-only
    image: ${HANGAR_REGISTRY:-agent-hangar}/agent-runtime:${HANGAR_VERSION:-latest}
    build: { context: ./runtime, args: { PYTHON_IMAGE: "${PYTHON_IMAGE:-python:3.12-slim}" } }

  mcp-stdio-runner:             # conectores stdio (npx/uvx): um container isolado por servidor, criado pela central
    <<: *build-only
    image: ${HANGAR_REGISTRY:-agent-hangar}/mcp-stdio-runner:${HANGAR_VERSION:-latest}
    build: { context: ./mcp-servers/stdio-runner, args: { NODE_IMAGE: "${NODE_IMAGE_STDIO:-node:24-slim}" } }

  harness-base:
    <<: *build-only
    image: ${HANGAR_REGISTRY:-agent-hangar}/harness-base:${HANGAR_VERSION:-latest}
    build: { context: ./harness, target: base, args: { NODE_IMAGE: "${NODE_IMAGE:-node:22-slim}" } }

  harness-claude-code:
    <<: *build-only
    profiles: [harness]
    image: ${HANGAR_REGISTRY:-agent-hangar}/harness-claude-code:${HANGAR_VERSION:-latest}
    build: { context: ./harness, target: claude-code, args: { NODE_IMAGE: "${NODE_IMAGE:-node:22-slim}" } }

  harness-codex:
    <<: *build-only
    profiles: [harness]
    image: ${HANGAR_REGISTRY:-agent-hangar}/harness-codex:${HANGAR_VERSION:-latest}
    build: { context: ./harness, target: codex, args: { NODE_IMAGE: "${NODE_IMAGE:-node:22-slim}" } }

  harness-deepseek-harness:
    <<: *build-only
    profiles: [harness]
    image: ${HANGAR_REGISTRY:-agent-hangar}/harness-deepseek-harness:${HANGAR_VERSION:-latest}
    build: { context: ./harness, target: deepseek-harness, args: { NODE_IMAGE: "${NODE_IMAGE:-node:22-slim}" } }

  harness-hermes:
    <<: *build-only
    profiles: [hermes]
    image: ${HANGAR_REGISTRY:-agent-hangar}/harness-hermes:${HANGAR_VERSION:-latest}
    build: { context: ./harness, target: hermes, args: { NODE_IMAGE: "${NODE_IMAGE:-node:22-slim}" } }

  central:
    image: ${HANGAR_REGISTRY:-agent-hangar}/central:${HANGAR_VERSION:-latest}
    build:
      context: .
      dockerfile: central/Dockerfile
      args: { PYTHON_IMAGE: "${PYTHON_IMAGE:-python:3.12-slim}", NODE_ALPINE_IMAGE: "${NODE_ALPINE_IMAGE:-node:22-alpine}" }
    depends_on:
      postgres: { condition: service_healthy }
      docker-proxy: { condition: service_started }
      agent-runtime: { condition: service_completed_successfully }
      harness-base: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hangar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hangar}
      DOCKER_HOST: tcp://docker-proxy:2375
      ADMIN_TOKEN: ${ADMIN_TOKEN:?rode scripts/setup.sh para gerar o .env}
      HANGAR_SECRET_KEY: ${HANGAR_SECRET_KEY:?rode scripts/setup.sh para gerar o .env}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?rode scripts/setup.sh para gerar o .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8090}
      # Data Studio (perfil data-studio): análise e entregáveis do Digital employee sobre os arquivos da tarefa
      DATA_STUDIO_URL: ${DATA_STUDIO_URL:-http://data-studio:8000/mcp}
      DATA_STUDIO_FILES_URL: ${DATA_STUDIO_FILES_URL:-http://data-studio:8001}
      # navegador governado (perfil browser): sistemas sem API, pela alçada
      BROWSER_URL: ${BROWSER_URL:-http://browser:8000/mcp}
      STAGE_IDLE_MIN: ${STAGE_IDLE_MIN:-30}   # stage sem uso hiberna (container parado) e acorda na próxima chamada; 0 desliga
      CONNECTOR_CHECK_MIN: ${CONNECTOR_CHECK_MIN:-30}   # status dos conectores (MCP) e ferramentas novas/alteradas; 0 desliga
      LLM_MODELS_REFRESH_MIN: ${LLM_MODELS_REFRESH_MIN:-60}   # lista de modelos de cada provedor; 0 desliga a atualização automática
      MODEL_PUBLIC_SOURCES: ${MODEL_PUBLIC_SOURCES:-1}   # fichas dos modelos: OpenRouter, Hugging Face e busca na web; 0 = sem internet
      MODEL_CATALOG_URL: ${MODEL_CATALOG_URL-https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json}  # vazio = sem internet
      # desktop governado (perfil desktop): apps de desktop olhando a tela, pela alçada
      DESKTOP_URL: ${DESKTOP_URL:-http://desktop:8000/mcp}
      LEARN_AFTER_MIN: ${LEARN_AFTER_MIN:-2}  # aprendizado: minutos depois do fim da tarefa (o juiz dá nota antes)
      REPLICA_ID: central  # nome estável: ao recriar o container, a central recupera os próprios jobs órfãos
      OAUTH_ENABLED: ${OAUTH_ENABLED:-1}
      OAUTH_REDIRECT_HOSTS: ${OAUTH_REDIRECT_HOSTS:-claude.ai,claude.com,chatgpt.com,chat.openai.com,platform.openai.com}
      INTERNAL_BASE_URL: http://central:8080
      HANGAR_REGISTRY: ${HANGAR_REGISTRY:-agent-hangar}
      HANGAR_VERSION: ${HANGAR_VERSION:-latest}
      AGENTS_NETWORK: hangar_agents
      JOBS_NETWORK: hangar_jobs
      DEFAULT_MODEL: ${DEFAULT_MODEL:-mock/echo}
      JOB_TIMEOUT_S: ${JOB_TIMEOUT_S:-180}
      # login OAuth2 (também configurável na UI, página "SSO e SCIM")
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      LOCAL_LOGIN: ${LOCAL_LOGIN:-1}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-1}
      SCHEDULE_MIN_INTERVAL_MIN: ${SCHEDULE_MIN_INTERVAL_MIN:-5}
      SCHEDULE_ALLOW_PRIVATE_WEBHOOKS: ${SCHEDULE_ALLOW_PRIVATE_WEBHOOKS:-0}
      # decisões por e-mail e resumo diário (opcional; Slack e Teams se configuram no portal) — ver docs/digital-employee.md
      PLUGIN_ALLOW_PRIVATE: ${PLUGIN_ALLOW_PRIVATE:-0}
      PLUGIN_ALLOW_UNPINNED: ${PLUGIN_ALLOW_UNPINNED:-0}
      PLUGIN_EGRESS: ${PLUGIN_EGRESS:-proxy}
      PLUGIN_RATE_LIMIT: ${PLUGIN_RATE_LIMIT:-120}
      PLUGIN_COSIGN_KEY: ${PLUGIN_COSIGN_KEY:-}
      PLUGIN_COSIGN_IDENTITY: ${PLUGIN_COSIGN_IDENTITY:-}
      PLUGIN_REQUIRE_SIGNED: ${PLUGIN_REQUIRE_SIGNED:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      # catálogo Docker MCP (profile mcp-gateway): a central escreve aqui o que o gateway deve rodar
      MCP_GATEWAY_CONFIG_DIR: /mcp-gateway
      MCP_GATEWAY_URL: ${MCP_GATEWAY_URL:-http://mcp-gateway:8811/mcp}
      # memória dos agentes (profile memory): MEMORY_URL=http://memory:8000 no .env liga — ver docs/memory.md
      MEMORY_URL: ${MEMORY_URL:-}
      MEMORY_TOKEN: ${MEMORY_TOKEN:-}
      MEMORY_LLM_CONNECTION: ${MEMORY_LLM_CONNECTION:-}
      MEMORY_LLM_MODEL: ${MEMORY_LLM_MODEL:-}
      MEMORY_LLM_OUTPUT_MODE: ${MEMORY_LLM_OUTPUT_MODE:-json_object}
      MEMORY_EMBEDDING_CONNECTION: ${MEMORY_EMBEDDING_CONNECTION:-}
      MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GOOGLE_ALLOWED_DOMAINS: ${OAUTH_GOOGLE_ALLOWED_DOMAINS:-}
      OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
      OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}
      OAUTH_MICROSOFT_TENANT: ${OAUTH_MICROSOFT_TENANT:-}
      OAUTH_MICROSOFT_ALLOWED_DOMAINS: ${OAUTH_MICROSOFT_ALLOWED_DOMAINS:-}
      OAUTH_MICROSOFT_FETCH_GROUPS: ${OAUTH_MICROSOFT_FETCH_GROUPS:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_GITHUB_ORGS: ${OAUTH_GITHUB_ORGS:-}
      OAUTH_GITHUB_FETCH_GROUPS: ${OAUTH_GITHUB_FETCH_GROUPS:-}
      OAUTH_OAUTH2_CLIENT_ID: ${OAUTH_OAUTH2_CLIENT_ID:-}
      OAUTH_OAUTH2_CLIENT_SECRET: ${OAUTH_OAUTH2_CLIENT_SECRET:-}
      OAUTH_OAUTH2_AUTHORIZE_URL: ${OAUTH_OAUTH2_AUTHORIZE_URL:-}
      OAUTH_OAUTH2_TOKEN_URL: ${OAUTH_OAUTH2_TOKEN_URL:-}
      OAUTH_OAUTH2_USERINFO_URL: ${OAUTH_OAUTH2_USERINFO_URL:-}
      OAUTH_OAUTH2_LABEL: ${OAUTH_OAUTH2_LABEL:-}
      OAUTH_OAUTH2_SCOPES: ${OAUTH_OAUTH2_SCOPES:-}
    volumes:
      - mcp_gateway:/mcp-gateway
    ports:
      - "${CENTRAL_PORT:-8090}:8080"
    # agents_net: containers dos agentes (chat) e Postgres. jobs_net: callback dos containers de job, que
    # NÃO estão em agents_net. docker_api: só a central alcança o proxy do Docker.
    networks: [agents_net, jobs_net, plugins_net, docker_api, db_net, memory_net, browser_net, desktop_net]
    restart: unless-stopped

  # MCP server de análise de dados e entregáveis (Python/DuckDB/PPTX/dashboards) — opcional:
  #   docker compose --profile data-studio up -d --build data-studio
  # Agentes o usam em http://data-studio:8000/mcp; os links de download saem por DATA_STUDIO_PUBLIC_URL.
  data-studio:
    profiles: [data-studio]
    image: ${HANGAR_REGISTRY:-agent-hangar}/mcp-data-studio:${HANGAR_VERSION:-latest}
    build: { context: ./mcp-servers/data-studio, args: { PYTHON_IMAGE: "${PYTHON_IMAGE:-python:3.12-slim}" } }
    depends_on: [data-studio-docker]   # proxy do Docker para os sandboxes (SANDBOX=container)
    environment:
      PUBLIC_URL: ${DATA_STUDIO_PUBLIC_URL:-http://localhost:8095}
      MAX_FILE_MB: ${DATA_STUDIO_MAX_FILE_MB:-200}
      RETENTION_DAYS: ${DATA_STUDIO_RETENTION_DAYS:-30}
      OFFLINE_HTML: ${DATA_STUDIO_OFFLINE_HTML:-0}
      # process = kernel por sessão neste container (uid próprio); container = um sandbox Docker por sessão
      SANDBOX: ${DATA_STUDIO_SANDBOX:-process}
      SANDBOX_IMAGE: ${HANGAR_REGISTRY:-agent-hangar}/mcp-data-studio:${HANGAR_VERSION:-latest}
      SANDBOX_VOLUME: hangar_data_studio
      SANDBOX_NETWORK: hangar_sandbox
      SANDBOX_MEM: ${DATA_STUDIO_SANDBOX_MEM:-2g}
      DOCKER_HOST: tcp://data-studio-docker:2375
    volumes:
      - data_studio:/data
    ports:
      - "127.0.0.1:${DATA_STUDIO_PORT:-8095}:8001"   # só os downloads; o MCP (8000) fica na rede interna
    networks: [agents_net, sandbox_net, ds_docker_api]
    mem_limit: ${DATA_STUDIO_MEM:-4g}
    pids_limit: 1024
    cap_drop: [ALL]
    # o servidor só troca de uid para isolar as sessões (setpriv) e ajusta donos dos workspaces
    cap_add: [SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE, KILL]
    security_opt: [no-new-privileges]
    restart: unless-stopped

  # Navegador governado: os Digital employees operam sistemas sem API (portais, sites de governo, ERPs antigos).
  #   docker compose --profile browser up -d --build browser
  # Só a central fala com ele (rede própria); cada chamada traz os domínios liberados, e a alçada fica na central.
  browser:
    profiles: [browser]
    image: ${HANGAR_REGISTRY:-agent-hangar}/mcp-browser:${HANGAR_VERSION:-latest}
    build: { context: mcp-servers/browser, args: { PYTHON_IMAGE: "${PYTHON_IMAGE:-python:3.12-slim}" } }
    environment:
      BROWSER_IDLE_MIN: ${BROWSER_IDLE_MIN:-15}
      BROWSER_MAX_SESSIONS: ${BROWSER_MAX_SESSIONS:-8}
    networks: [browser_net]
    mem_limit: ${BROWSER_MEM:-2g}
    shm_size: 1g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    restart: unless-stopped

  # Desktop governado: um desktop Linux isolado (Cua) com os apps liberados; a central fala com o
  # portão em :8000/mcp e o token da Cua nunca sai do container
  desktop:
    profiles: [desktop]
    image: ${HANGAR_REGISTRY:-agent-hangar}/desktop:${HANGAR_VERSION:-latest}
    build: { context: mcp-servers/desktop }
    environment:
      DESKTOP_IDLE_MIN: ${DESKTOP_IDLE_MIN:-20}
    networks: [desktop_net]
    mem_limit: ${DESKTOP_MEM:-4g}
    shm_size: 1g
    pids_limit: 1024
    restart: unless-stopped

  # Docker (via proxy restrito a containers) só para o Data Studio criar os sandboxes por sessão (SANDBOX=container)
  data-studio-docker:
    profiles: [data-studio]
    image: ${DOCKER_PROXY_IMAGE:-tecnativa/docker-socket-proxy:v0.4.1}
    environment:
      CONTAINERS: 1
      POST: 1
      DELETE: 1
      IMAGES: 0
      EXEC: 0
      BUILD: 0
      NETWORKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [ds_docker_api]
    restart: unless-stopped

  # Catálogo Docker MCP — 230+ servidores MCP prontos, cada um num container isolado (opcional):
  #   docker compose --profile mcp-gateway up -d
  # Ative os servidores em Catálogo -> "Catálogo Docker MCP"; os agentes os usam como `docker:<nome>`.
  # Camadas: os agentes falam com `mcp-gateway` (encaminhador) -> o gateway fica numa rede própria, junto dos
  # servidores MCP que ele cria (o gateway liga os servidores a TODAS as redes dele: por isso ele não está na rede
  # dos agentes nem na do Docker). Docker só por um socket unix (shim) que repassa ao proxy restrito.
  mcp-gateway:
    profiles: [mcp-gateway]
    image: alpine/socat:1.8.0.3
    command: TCP-LISTEN:8811,fork,reuseaddr TCP:mcp-gateway-core:8811
    depends_on: [mcp-gateway-core]
    networks: [agents_net, mcp_servers_net]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    restart: unless-stopped

  mcp-gateway-core:
    profiles: [mcp-gateway]
    image: docker/mcp-gateway:${MCP_GATEWAY_VERSION:-v0.43.3}   # estável (a v0.44.x é pré-release)
    depends_on: [mcp-gateway-shim]
    environment:
      DOCKER_MCP_IN_CONTAINER: "1"
      DOCKER_CONFIG: /docker-config   # features: sem mcp-add/mcp-remove para os LLMs; ferramentas com prefixo
    command:
      - --transport=streaming
      - --port=8811
      - --registry=/mcp-config/registry.yaml
      - --config=/mcp-config/config.yaml
      - --secrets=/mcp-config/secrets.env
      - --watch
      - --verify-signatures
      - --block-secrets
      - --long-lived
      - --allow-unauthenticated        # só alcançável pela rede interna, via o encaminhador (sem porta publicada)
    volumes:
      - mcp_gateway:/mcp-config:ro
      - mcp_gateway_sock:/var/run
      - ./mcp-servers/docker-gateway/docker-config.json:/docker-config/config.json:ro
    networks: [mcp_servers_net]
    restart: unless-stopped

  mcp-gateway-shim:
    profiles: [mcp-gateway]
    image: alpine/socat:1.8.0.3
    # unlink-early: se o Docker caiu sem desligar limpo, o socket antigo fica no volume e o socat recusaria subir
    command: UNIX-LISTEN:/sock/docker.sock,fork,mode=660,unlink-early TCP:mcp-gateway-docker:2375
    depends_on: [mcp-gateway-docker]
    volumes:
      - mcp_gateway_sock:/sock
    networks: [mcp_gateway_docker_api]
    restart: unless-stopped

  mcp-gateway-docker:
    profiles: [mcp-gateway]
    image: ${DOCKER_PROXY_IMAGE:-tecnativa/docker-socket-proxy:v0.4.1}
    environment:
      CONTAINERS: 1
      IMAGES: 1          # baixa as imagens assinadas dos servidores
      POST: 1
      DELETE: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      INFO: 1
      EXEC: 0
      BUILD: 0
      NETWORKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [mcp_gateway_docker_api]
    restart: unless-stopped

  # Activepieces (MIT) — 280+ integrações de negócio (Gmail, Sheets, Slack, HubSpot…) expostas por MCP com OAuth:
  #   docker compose --profile activepieces up -d
  # Depois: crie a conta em http://localhost:8098, conecte os apps lá, e no Hangar vá em Catálogo -> "MCPs remotos
  # com OAuth" -> nome "activepieces", URL http://activepieces/mcp, origem pública http://localhost:8098.
  activepieces:
    profiles: [activepieces]
    image: ghcr.io/activepieces/activepieces:${ACTIVEPIECES_VERSION:-0.92.0}
    depends_on: [activepieces-postgres, activepieces-redis]
    environment:
      AP_ENGINE_EXECUTABLE_PATH: dist/packages/engine/main.js
      AP_ENCRYPTION_KEY: ${ACTIVEPIECES_ENCRYPTION_KEY:-}
      AP_JWT_SECRET: ${ACTIVEPIECES_JWT_SECRET:-}
      AP_ENVIRONMENT: prod
      AP_FRONTEND_URL: ${ACTIVEPIECES_PUBLIC_URL:-http://localhost:8098}
      AP_POSTGRES_DATABASE: activepieces
      AP_POSTGRES_HOST: activepieces-postgres
      AP_POSTGRES_PORT: "5432"
      AP_POSTGRES_USERNAME: activepieces
      AP_POSTGRES_PASSWORD: ${ACTIVEPIECES_POSTGRES_PASSWORD:-}
      AP_REDIS_HOST: activepieces-redis
      AP_REDIS_PORT: "6379"
      AP_EXECUTION_MODE: UNSANDBOXED
      AP_TELEMETRY_ENABLED: "false"
      AP_FLOW_TIMEOUT_SECONDS: "600"
    # agents_net: a central (e só ela, com o token OAuth) fala com o /mcp; saída para a internet (APIs dos apps)
    networks: [agents_net, activepieces_db]
    restart: unless-stopped

  # porta pública do Activepieces: repassa o host com a porta (X-Forwarded-Host) — sem isso os redirecionamentos do
  # OAuth vão para http://localhost/... (porta perdida). Ver integrations/activepieces/edge.conf.
  activepieces-edge:
    profiles: [activepieces]
    image: nginx:1.27-alpine
    depends_on: [activepieces]
    volumes:
      - ./integrations/activepieces/edge.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${ACTIVEPIECES_PORT:-8098}:80"   # UI do Activepieces (login, conexões, consentimento do OAuth)
    networks: [agents_net]
    restart: unless-stopped

  activepieces-postgres:
    profiles: [activepieces]
    image: pgvector/pgvector:0.8.0-pg14
    environment:
      POSTGRES_DB: activepieces
      POSTGRES_USER: activepieces
      POSTGRES_PASSWORD: ${ACTIVEPIECES_POSTGRES_PASSWORD:-}
    volumes:
      - activepieces_pg:/var/lib/postgresql/data
    networks: [activepieces_db]
    restart: unless-stopped

  activepieces-redis:
    profiles: [activepieces]
    image: redis:7.0.7
    volumes:
      - activepieces_redis:/data
    networks: [activepieces_db]
    restart: unless-stopped

  # Memória dos agentes: Graphiti (grafo de conhecimento temporal). Neo4j Community é o padrão:
  #   docker compose --profile memory up -d --build
  # FalkorDB (mais rápido, licença SSPL) no lugar do Neo4j: MEMORY_BACKEND=falkordb no .env e
  #   docker compose --profile memory-falkordb up -d --build
  # Mem0 (fatos com busca vetorial, sem banco de grafo) sobre Postgres com pgvector: MEMORY_BACKEND=mem0 e
  #   docker compose --profile memory-mem0 up -d --build
  # Só a central fala com o serviço (MEMORY_TOKEN); os agentes passam por /internal/memory/mcp na central.
  memory:
    profiles: [memory, memory-falkordb, memory-mem0]
    image: ${HANGAR_REGISTRY:-agent-hangar}/mcp-memory:${HANGAR_VERSION:-latest}
    build: { context: mcp-servers/memory, args: { PYTHON_IMAGE: "${PYTHON_IMAGE:-python:3.12-slim}" } }
    environment:
      MEMORY_BACKEND: ${MEMORY_BACKEND:-neo4j}
      MEMORY_TOKEN: ${MEMORY_TOKEN:-}
      CENTRAL_URL: http://central:8080
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      FALKORDB_HOST: falkordb
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-}
      MEMORY_EMBEDDER: ${MEMORY_EMBEDDER:-local}
      EMBEDDING_DIM: ${MEMORY_EMBEDDING_DIM:-384}  # 384 = modelo local; ajuste ao modelo remoto
      # Mem0: o Postgres do perfil memory-mem0, ou um Postgres da empresa com pgvector (RDS, Cloud SQL, Azure)
      MEM0_PG_URL: ${MEM0_PG_URL:-postgresql://mem0:${MEM0_PG_PASSWORD:-}@mem0-postgres:5432/mem0}
    volumes:
      - memory_data:/data   # Mem0: o histórico de mudanças de cada fato (SQLite)
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges"]
    # memory_net: só a central (e saída para o LLM de extração); memory_db: o banco de grafo, sem internet
    networks: [memory_net, memory_db]
    restart: unless-stopped

  mem0-postgres:
    profiles: [memory-mem0]
    image: ${MEM0_PG_IMAGE:-pgvector/pgvector:0.8.6-pg17}
    environment:
      POSTGRES_DB: mem0
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: ${MEM0_PG_PASSWORD:-}
    volumes:
      - mem0_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem0 -d mem0"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [memory_db]   # sem internet; só o serviço de memória o alcança
    restart: unless-stopped

  neo4j:
    profiles: [memory]
    image: neo4j:${NEO4J_VERSION:-5.26.31-community}
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512M}
    volumes:
      - neo4j_data:/data
    ports:  # Neo4j Browser só no localhost, para inspecionar o grafo (bolt na 7687)
      - "127.0.0.1:${NEO4J_BROWSER_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [memory_db]
    restart: unless-stopped

  falkordb:
    profiles: [memory-falkordb]
    image: falkordb/falkordb:${FALKORDB_VERSION:-v4.20.7}
    environment:
      REDIS_ARGS: "--requirepass ${FALKORDB_PASSWORD:-}"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    networks: [memory_db]
    restart: unless-stopped

  # Exposição pública sem abrir portas (o `hangar setup` liga um destes). Os três levam HTTPS até a central:8080.
  # Cloudflare Tunnel: crie o túnel no Zero Trust, adicione o hostname público -> http://central:8080 e use o token.
  cloudflared:
    profiles: [tunnel-cloudflare]
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.9.3}
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks: [agents_net]
    restart: unless-stopped

  # ngrok: domínio fixo (o gratuito também serve) em NGROK_DOMAIN e o authtoken da sua conta.
  ngrok:
    profiles: [tunnel-ngrok]
    image: ngrok/ngrok:${NGROK_VERSION:-3.39.11-alpine}
    command: ["http", "central:8080", "--url=${NGROK_DOMAIN:-}", "--log=stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    networks: [agents_net]
    restart: unless-stopped

  # Tailscale Funnel: https://<TS_HOSTNAME>.<sua-tailnet>.ts.net (habilite o Funnel na política da tailnet).
  tailscale:
    profiles: [tunnel-tailscale]
    image: tailscale/tailscale:${TAILSCALE_VERSION:-v1.102.5}
    hostname: ${TS_HOSTNAME:-agent-hangar}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-agent-hangar}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./integrations/tailscale:/config:ro
    networks: [agents_net]
    restart: unless-stopped

volumes:
  tailscale_state:
  neo4j_data:
  falkordb_data:
  memory_data:
  mem0_pg:
  activepieces_pg:
  activepieces_redis:
  mcp_gateway:
    name: hangar_mcp_gateway
  mcp_gateway_sock:
  data_studio:
    name: hangar_data_studio   # nome fixo: os sandboxes montam subpastas dele
  pgdata:
    # instalações antigas (central-agents) reaproveitam o volume com PGDATA_VOLUME=central-agents_pgdata
    name: ${PGDATA_VOLUME:-agent-hangar_pgdata}

networks:
  agents_net:
    name: hangar_agents
  jobs_net:
    name: hangar_jobs
  plugins_net:
    name: hangar_plugins       # plugins com código: sem agentes, banco, memória nem a API do Docker, e sem saída direta:
    internal: true             # a internet só pelo proxy da central (central:3128), que libera os hosts de server.egress
  docker_api:
    internal: true
  db_net:
    internal: true
  sandbox_net:
    name: hangar_sandbox       # sandboxes do Data Studio: saída para a internet, sem os agentes nem o banco
  ds_docker_api:
    internal: true
  mcp_servers_net:
    name: hangar_mcp_servers   # gateway + servidores MCP do catálogo Docker: saída para a internet, sem agentes nem banco
  mcp_gateway_docker_api:
    internal: true
  activepieces_db:
    internal: true
  memory_net:
    name: hangar_memory
  memory_db:
    internal: true
  browser_net:
    name: hangar_browser       # navegador governado: só a central o alcança; ele sai para a internet
  desktop_net:
    name: hangar_desktop       # desktop governado: só a central o alcança; sem saída para a internet
    internal: true
