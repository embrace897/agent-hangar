# Agent Hangar — valores padrão. Presets por nuvem: values-gke.yaml, values-aks.yaml, values-eks.yaml, values-local.yaml.
# O `hangar setup` (alvo kubernetes) gera um values com as suas escolhas; veja docs/kubernetes.md.

image:
  registry: ghcr.io/valteresj2      # imagens: <registry>/central, agent-runtime, harness-*, mcp-memory
  tag: ""                           # vazio = appVersion do chart
  pullPolicy: IfNotPresent
  pullSecrets: []                   # registry privado / espelho (air-gapped): [regcred]

# Endereço pelo qual as pessoas acessam (ingress, túnel). Obrigatório fora de testes: links, OAuth e cookies dependem dele.
publicUrl: ""

# OAuth do MCP: Claude.ai, ChatGPT e outros clientes web conectam com a URL <publicUrl>/mcp, a pessoa entra e autoriza.
mcpOAuth:
  enabled: true
  redirectHosts: ""                 # vazio = claude.ai, claude.com, chatgpt.com, openai.com; "*" = qualquer https

# Identidade da nuvem (workload identity) para a central — sem chave de conta de serviço no cluster:
#   GKE: {iam.gke.io/gcp-service-account: hangar@PROJETO.iam.gserviceaccount.com}
#   EKS: {eks.amazonaws.com/role-arn: arn:aws:iam::CONTA:role/agent-hangar}
#   AKS: {azure.workload.identity/client-id: <client-id>}  (+ central.podLabels {azure.workload.identity/use: "true"})
serviceAccount:
  annotations: {}

central:
  # Alta disponibilidade: 2+ réplicas atrás do Service, atualização sem parada (RollingUpdate), PodDisruptionBudget e
  # réplicas espalhadas entre nós. O estado compartilhado fica no Postgres — use um banco gerenciado (com HA) em produção.
  replicas: 1
  pdb:
    minAvailable: 1                 # só com replicas > 1
  podLabels: {}
  podAnnotations: {}
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  extraEnv: {}                      # variáveis extras (ver .env.example), ex.: {SESSION_TTL_HOURS: "8"}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Segredos. Vazios = gerados na primeira instalação e preservados nos upgrades.
# Empresas com Vault / External Secrets: crie um Secret com as chaves ADMIN_TOKEN, HANGAR_SECRET_KEY, INTERNAL_SECRET,
# DATABASE_URL (+ MEMORY_TOKEN, NEO4J_PASSWORD/FALKORDB_PASSWORD com memória, OAUTH_*_CLIENT_SECRET com SSO,
# CLOUDFLARE_TUNNEL_TOKEN com túnel) e informe o nome em existingSecret.
secrets:
  existingSecret: ""
  adminToken: ""                    # acesso de emergência (break-glass)
  secretKey: ""                     # Fernet: criptografa as chaves de LLM no banco — NUNCA troque depois de instalar
  internalSecret: ""

postgresql:
  enabled: true                     # Postgres no cluster (StatefulSet). Produção: prefira o gerenciado (abaixo)
  image: postgres:16
  password: ""
  storage: 10Gi
  storageClass: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  # Gerenciado (Cloud SQL, Azure Database for PostgreSQL, Amazon RDS/Aurora): enabled=false e um dos dois
  # GKE + Cloud SQL: o Cloud SQL Auth Proxy roda ao lado da central (sidecar), com a identidade da nuvem (sem senha
  # de rede, sem IP no allowlist). Use com postgresql.enabled=false e external.url apontando para 127.0.0.1:5432.
  cloudSqlProxy:
    enabled: false
    instance: ""                    # PROJETO:REGIÃO:INSTÂNCIA
    privateIp: true
    iamAuth: false                  # login IAM no banco (usuário = conta de serviço, sem senha)
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
  external:
    url: ""                         # postgresql+psycopg://usuario:senha@host:5432/hangar?sslmode=require
    existingSecret: ""              # Secret com a chave DATABASE_URL

agents:
  stageIdleMin: 30                  # stage sem uso por N minutos vai a 0 réplicas e volta na próxima chamada; 0 desliga
  memLimit: 512m                    # por agente (Deployment)
  cpus: "1.0"
  jobMemLimit: 1g                   # por job de harness / avaliação de código (Job)
  # sandbox de kernel próprio para agentes, jobs e plugins com código: o RuntimeClass do cluster (GKE Sandbox: gvisor;
  # Kata: kata); vazio = o runtime padrão. O RuntimeClass precisa existir no cluster.
  runtimeClassName: ""
  jobCpus: "1.0"
  jobTimeoutS: 180
  defaultModel: mock/echo           # agentes sem conexão de LLM

# Memória de longo prazo dos agentes (Graphiti). Precisa de uma conexão de LLM (protocol openai) para extrair fatos.
memory:
  enabled: false
  backend: neo4j                    # neo4j | falkordb
  llmConnection: ""                 # nome da conexão no catálogo do Hangar
  outputMode: json_object           # json_schema se o provedor suportar
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 2Gi}
  neo4j:
    image: neo4j:5.26.31-community
    password: ""
    heap: 1G
    pagecache: 512M
    storage: 10Gi
    storageClass: ""
  falkordb:
    image: falkordb/falkordb:v4.20.7
    password: ""
    storage: 10Gi
    storageClass: ""

ingress:
  enabled: false
  className: ""                     # nginx | gce | webapprouting.kubernetes.azure.com | alb | traefik
  host: ""                          # hangar.suaempresa.com
  annotations: {}                   # ex.: cert-manager.io/cluster-issuer: letsencrypt
  tls:
    enabled: true
    secretName: ""                  # vazio = <release>-tls (cert-manager preenche)
  gkeManagedCertificate: false      # GKE: cria um ManagedCertificate (Google) para o host

# Túnel Cloudflare (HTTPS público sem load balancer): no Zero Trust, Public Hostname -> http://<release>-central:8080
tunnel:
  cloudflare:
    enabled: false
    token: ""
    image: cloudflare/cloudflared:2026.9.3

sso:
  localLogin: true                  # contas locais (usuário e senha); false = só SSO
  bootstrapAdminEmails: ""          # e-mails que viram admin no primeiro login SSO
  google: {clientId: "", clientSecret: "", allowedDomains: ""}
  microsoft: {clientId: "", clientSecret: "", tenant: "", allowedDomains: "", fetchGroups: false}
  github: {clientId: "", clientSecret: "", orgs: ""}
  oauth2: {clientId: "", clientSecret: "", label: "", authorizeUrl: "", tokenUrl: "", userinfoUrl: "", scopes: ""}

# Conectores (MCP): o status de cada um e as ferramentas novas/alteradas são conferidos a cada checkMin minutos (0 desliga)
connectors:
  checkMin: 30

# Lista de modelos de cada provedor de LLM (tipo, contexto e preço): atualizada a cada refreshMin minutos (0 desliga).
# catalogUrl: tabela pública de modelos do LiteLLM para completar tipo e preço; vazio em cluster sem saída para a internet.
llmModels:
  refreshMin: 60
  catalogUrl: "https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json"
  publicSources: true   # fichas dos modelos: descrição do OpenRouter, card do Hugging Face e busca na web

# Ferramentas do analista no cluster (desligadas por padrão): o Data Studio roda o código em processos isolados
# dentro do próprio pod; o navegador governado só fala com a central. Os dois saem só para a internet (sem IPs privados).
dataStudio:
  enabled: false
  storage: 10Gi                     # workspaces das sessões e entregáveis
  storageClass: ""
  maxFileMb: 200
  retentionDays: 30
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {cpu: "2", memory: 4Gi}
browser:
  enabled: false
  idleMin: 15                       # sessão sem uso fecha depois de N minutos
  maxSessions: 8
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}

networkPolicy:
  enabled: true                     # exige um CNI que aplique NetworkPolicy (GKE Dataplane V2, AKS com política, EKS com VPC CNI policy, Calico, Cilium…)
  allowPrivateEgress: false         # agentes/jobs alcançam IPs privados (ex.: gateway de LLM dentro da rede)
  extraAgentEgress: []              # regras extras de egress para agentes/jobs (formato NetworkPolicyEgressRule)

scheduler:
  enabled: true

# Plugins com código (runtime: server)
plugins:
  egress: proxy                     # proxy: saem só pelo proxy da central, para os hosts de server.egress | open: saída direta
  rateLimitPerMin: 120              # chamadas por minuto por instalação (o manifesto e a instalação podem mudar); 0 = sem limite
  cosign:                           # assinatura das imagens: chave pública (PEM) OU keyless (identidade + emissor)
    key: ""
    identity: ""                    # regex da identidade do certificado, ex.: ^https://github.com/minha-empresa/
    issuer: https://token.actions.githubusercontent.com
    required: false                 # true: não aprova nem sobe imagem sem assinatura válida

# Segredos num cofre da empresa via External Secrets Operator (AWS Secrets Manager, GCP Secret Manager, Azure Key Vault,
# HashiCorp Vault…). O operador cria o Secret <release>-secrets com as chaves ADMIN_TOKEN, HANGAR_SECRET_KEY,
# INTERNAL_SECRET, DATABASE_URL (+ POSTGRES_PASSWORD com o Postgres do chart, MEMORY_TOKEN/NEO4J_PASSWORD com memória,
# OAUTH_*_CLIENT_SECRET com SSO, CLOUDFLARE_TUNNEL_TOKEN com túnel). O chart deixa de gerar segredos.
externalSecrets:
  enabled: false
  secretStoreRef: {name: "", kind: ClusterSecretStore}
  refreshInterval: 1h
  apiVersion: external-secrets.io/v1   # operador antigo (< 0.17): external-secrets.io/v1beta1
  remoteKey: ""                     # um segredo do cofre com todas as chaves (JSON) — o mais simples
  data: []                          # ou chave a chave: [{secretKey: ADMIN_TOKEN, remoteRef: {key: hangar/admin-token}}]

observability:
  metrics:
    enabled: true                   # Prometheus em :9100/metrics (porta fora do Ingress)
    port: 9100
  serviceMonitor:                   # Prometheus Operator (kube-prometheus-stack, GKE Managed Prometheus via PodMonitoring…)
    enabled: false
    interval: 30s
    labels: {}
  grafanaDashboard:                 # ConfigMap com o dashboard; o sidecar do Grafana importa pelo rótulo
    enabled: false
    labels: {grafana_dashboard: "1"}
  logFormat: json                   # json | text
  otlp:                             # traces OpenTelemetry (Tempo, Jaeger, Langfuse, Datadog, Cloud Trace, X-Ray via collector)
    endpoint: ""                    # ex.: http://otel-collector.observability:4318
    sampleRatio: "1.0"

# Backup do Postgres (pg_dump) num volume: diário e, antes de cada `helm upgrade`, automático. Com banco gerenciado,
# prefira os backups/PITR da nuvem — este job também funciona contra ele, como cópia lógica extra.
backup:
  enabled: false
  schedule: "0 3 * * *"
  keep: 14                          # quantos arquivos manter
  beforeUpgrade: true               # hook pre-upgrade: o upgrade só segue se o backup der certo
  storage: 20Gi
  storageClass: ""
  image: postgres:16                # mesma versão principal do servidor (ou mais nova): Cloud SQL/RDS 17 -> postgres:17

