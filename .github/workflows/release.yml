name: Release images

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # assinatura keyless (cosign + OIDC do GitHub): sem chave privada para guardar

jobs:
  # Cada imagem é construída em runner nativo de cada arquitetura (amd64 e arm64: Graviton, Ampere, T2A, Macs M1+)
  # e enviada só por digest; o job "images" junta as duas num índice multi-arquitetura, põe as tags e assina.
  build:
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - {name: central, context: ., file: central/Dockerfile, target: ""}
          - {name: agent-runtime, context: runtime, file: runtime/Dockerfile, target: ""}
          - {name: harness-base, context: harness, file: harness/Dockerfile, target: base}
          - {name: harness-claude-code, context: harness, file: harness/Dockerfile, target: claude-code}
          - {name: harness-codex, context: harness, file: harness/Dockerfile, target: codex}
          - {name: harness-deepseek-harness, context: harness, file: harness/Dockerfile, target: deepseek-harness}
          - {name: harness-hermes, context: harness, file: harness/Dockerfile, target: hermes}
          - {name: mcp-data-studio, context: mcp-servers/data-studio, file: mcp-servers/data-studio/Dockerfile, target: ""}
          - {name: mcp-memory, context: mcp-servers/memory, file: mcp-servers/memory/Dockerfile, target: ""}
          - {name: mcp-browser, context: mcp-servers/browser, file: mcp-servers/browser/Dockerfile, target: ""}
          - {name: desktop, context: mcp-servers/desktop, file: mcp-servers/desktop/Dockerfile, target: ""}
          - {name: mcp-stdio-runner, context: mcp-servers/stdio-runner, file: mcp-servers/stdio-runner/Dockerfile, target: ""}
        arch:
          - {platform: linux/amd64, runner: ubuntu-latest, tag: amd64}
          - {platform: linux/arm64, runner: ubuntu-24.04-arm, tag: arm64}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3   # antes do buildx: o buildkit e as imagens base vêm do espelho no GHCR
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Use the base images mirror
        run: sh .github/scripts/use-mirror.sh
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: ${{ matrix.arch.platform }}
          build-args: |
            PYTHON_IMAGE=${{ env.PYTHON_IMAGE }}
            NODE_IMAGE=${{ env.NODE_IMAGE }}
            NODE_ALPINE_IMAGE=${{ env.NODE_ALPINE_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.arch.tag }}
          sbom: true                # SBOM (SPDX) e proveniência SLSA anexados à imagem no registry
          provenance: mode=max
      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.arch.tag }}
          path: /tmp/digests/*
          retention-days: 1

  images:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [central, agent-runtime, harness-base, harness-claude-code, harness-codex, harness-deepseek-harness,
               harness-hermes, mcp-data-studio, mcp-memory, mcp-browser, desktop, mcp-stdio-runner]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Use the base images mirror
        run: sh .github/scripts/use-mirror.sh
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: sigstore/cosign-installer@v3
      - name: Create the multi-arch index, then sign it (cosign keyless)
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
        run: |
          test "$(ls | wc -l)" -eq 2   # amd64 + arm64
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")             $(printf "$IMAGE@sha256:%s " *)
          VERSION_TAG=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "$VERSION_TAG"
          DIGEST=$(docker buildx imagetools inspect "$VERSION_TAG" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "$IMAGE@$DIGEST"

  chart:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - uses: sigstore/cosign-installer@v3
      - name: Package, push and sign the Helm chart (OCI)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package charts/agent-hangar --version "$VERSION" --app-version "$VERSION"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "agent-hangar-$VERSION.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts" 2>&1 | tee push.log
          DIGEST=$(grep -o 'sha256:[0-9a-f]\{64\}' push.log | head -1)
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/agent-hangar@${DIGEST}"

  # A release do GitHub nasce sozinha, depois que as imagens e o chart foram publicados e assinados: título vindo da
  # tag anotada, notas de release-notes/<tag>.md (ou da seção do CHANGELOG) e a extensão do VS Code anexada.
  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [images, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the annotated tag (its subject becomes the title)
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build the VS Code extension
        working-directory: extensions/vscode
        run: |
          npm ci --no-audit --no-fund
          LICENSE_PATH=../../LICENSE npm run package
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh .github/scripts/github-release.sh "$GITHUB_REF_NAME"
