name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read   # o espelho das imagens base (.github/base-images.txt)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: central/requirements.txt
      - run: pip install -r central/requirements.txt pytest ruff ag-ui-protocol -e ./cli
      - run: ruff check .
      - run: pytest
      - name: Test portal translator
        run: node --test tests/js/i18n.test.mjs
      - name: Check JS syntax
        run: |
          for f in central/app/static/*.js; do node --check "$f"; done
          node --check harness/entrypoint.js
          node --check harness/eval_runner.js

  # Instalador e CLI no macOS (Apple Silicon): ferramentas BSD, venv, `hangar setup --answers` até o .env.
  # O runner não tem Docker; a subida da stack é coberta pelo job e2e (Linux).
  installer-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Installer (setup.sh, install.sh, hangar setup --no-start)
        run: sh .github/ci/macos_install_check.sh
      - name: CLI tests (and the central's dependencies on macOS arm64)
        run: |
          pip install -q -r central/requirements.txt pytest -e ./cli
          pytest -q tests/test_cli_setup.py tests/test_cli_backup.py

  helm-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - run: helm lint charts/agent-hangar
      - name: Render every preset
        run: |
          for p in local gke aks eks; do
            helm template t charts/agent-hangar -f charts/agent-hangar/values-$p.yaml               --set publicUrl=https://h.example.com --set ingress.host=h.example.com --set memory.enabled=true > /dev/null
          done

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive deploy/terraform
      - name: Validate GKE, AKS and EKS
        run: |
          for d in gke aks eks; do
            (cd deploy/terraform/$d && terraform init -backend=false -input=false >/dev/null && terraform validate)
          done

  vulnerabilities:
    # relatório (não bloqueia): CVEs críticas/altas com correção na imagem da central e configuração insegura no chart
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4   # o espelho das imagens base no GHCR (forks sem acesso caem no Docker Hub)
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Use the base images mirror
        run: sh .github/scripts/use-mirror.sh
      - name: Build the central image
        run: docker build -q -t hangar-central:ci --build-arg PYTHON_IMAGE --build-arg NODE_ALPINE_IMAGE -f central/Dockerfile .
      - name: Scan the image (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image             --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --no-progress hangar-central:ci
      - name: Scan the Helm chart (Trivy misconfiguration)
        run: |
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" config --severity CRITICAL,HIGH --ignorefile /src/.trivyignore --exit-code 1 /src/charts/agent-hangar

  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: LICENSE_PATH=../../LICENSE npm run package

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # CLI direto (não a action): varre o histórico inteiro, inclusive o primeiro push
      - name: Gitleaks (full history)
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --verbose

  e2e:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: docker/login-action@v4   # o espelho das imagens base no GHCR (forks sem acesso caem no Docker Hub)
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Use the base images mirror
        run: sh .github/scripts/use-mirror.sh
      - name: Configure
        run: sh scripts/setup.sh
      - name: Build and start (mock mode, no harness CLIs, with the Data Studio MCP)
        env:
          PLUGIN_ALLOW_PRIVATE: "1"    # o sistema de mentira dos plugins está numa rede privada
          PLUGIN_ALLOW_UNPINNED: "1"   # o plugin com código usa a imagem local do runtime
        run: |
          docker compose --profile data-studio up -d --build
          for i in $(seq 1 60); do curl -fs http://localhost:8090/api/health && exit 0; sleep 2; done
          docker compose logs central; exit 1
      - name: Smoke test
        run: |
          pip install httpx
          HANGAR_TOKEN=$(grep '^ADMIN_TOKEN=' .env | cut -d= -f2-) SMOKE_DATA_STUDIO=1 python tests/e2e/smoke.py
      - name: Digital employees and plugins (E2E)
        run: |
          docker run -d --name e2e-echo --network hangar_agents -v "$PWD/tests/e2e:/e2e:ro" "$PYTHON_IMAGE" python /e2e/echo_server.py
          docker network connect hangar_plugins e2e-echo
          pip install "mcp>=1.10,<2" pyyaml
          HANGAR_TOKEN=$(grep '^ADMIN_TOKEN=' .env | cut -d= -f2-) ECHO_URL=http://e2e-echo:8080 python tests/e2e/workforce.py
      - name: Day-to-day work (E2E)
        run: HANGAR_TOKEN=$(grep '^ADMIN_TOKEN=' .env | cut -d= -f2-) ECHO_URL=http://e2e-echo:8080 python tests/e2e/work.py
      - name: Company, LLM connections, execution profile, AG-UI, harness, connectors and skills (E2E)
        run: |
          pip install ag-ui-protocol
          HANGAR_TOKEN=$(grep '^ADMIN_TOKEN=' .env | cut -d= -f2-) ECHO_URL=http://e2e-echo:8080 python tests/e2e/features.py
      - name: Lifecycle, budgets, governance, access, versions, SCIM and dashboards (E2E)
        run: HANGAR_TOKEN=$(grep '^ADMIN_TOKEN=' .env | cut -d= -f2-) ECHO_URL=http://e2e-echo:8080 python tests/e2e/coverage.py
      - name: Interface in English, broken pages and phone layout
        run: |
          pip install httpx playwright==1.63.0
          python -m playwright install --with-deps chromium
          HANGAR_TOKEN=$(grep '^ADMIN_TOKEN=' .env | cut -d= -f2-) python tests/e2e/i18n_crawl.py
      - name: Actions in the interface (console and portal, real clicks)
        run: HANGAR_TOKEN=$(grep '^ADMIN_TOKEN=' .env | cut -d= -f2-) python tests/e2e/ui_actions.py
      - name: CopilotKit example app in a real browser (AG-UI)
        run: |
          export HANGAR_TOKEN=$(grep '^ADMIN_TOKEN=' .env | cut -d= -f2-) ECHO_URL=http://e2e-echo:8080
          docker build -q --build-arg NODE_ALPINE_IMAGE="${NODE_ALPINE_IMAGE:-node:22-alpine}" -t agent-hangar/copilotkit-example integrations/copilotkit
          python tests/e2e/copilotkit.py setup > /tmp/ck.env
          trap 'python tests/e2e/copilotkit.py cleanup /tmp/ck.env' EXIT
          docker run -d --name e2e-copilotkit --network host --env-file /tmp/ck.env agent-hangar/copilotkit-example
          python tests/e2e/copilotkit.py browser /tmp/ck.env || { docker logs --tail 80 e2e-copilotkit; exit 1; }
      - name: Harness job with a workspace owned by another user (Kubernetes emptyDir)
        run: sh harness/tests/workspace_owner_check.sh agent-hangar/harness-base:latest
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200 central

  kubernetes:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: docker/login-action@v4   # o espelho das imagens base no GHCR (forks sem acesso caem no Docker Hub)
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Use the base images mirror
        run: sh .github/scripts/use-mirror.sh
      - name: Build the images the chart uses
        run: sh scripts/setup.sh && docker compose build central agent-runtime harness-base mcp-stdio-runner
      - name: Helm chart on k3s, smoke test and hangar test-drive (Kubernetes driver)
        run: |
          pip install httpx pyyaml ./cli
          sh tests/e2e/k8s.sh

  data-studio:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4   # o espelho das imagens base no GHCR (forks sem acesso caem no Docker Hub)
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Use the base images mirror
        run: sh .github/scripts/use-mirror.sh
      - name: Configure
        run: sh scripts/setup.sh
      - name: Build and start the Data Studio MCP server
        run: |
          docker compose --profile data-studio up -d --build data-studio
          timeout 180 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" $(docker compose ps -q data-studio))" = healthy ]; do sleep 3; done'
      - name: Workspace retention
        run: docker run --rm -v "$PWD/mcp-servers/data-studio/tests:/t" agent-hangar/mcp-data-studio python /t/test_retention.py
      - name: MCP smoke test — process sandbox (tools, deliverables, preview, session isolation)
        run: docker run --rm --network hangar_agents -v "$PWD/mcp-servers/data-studio/tests:/t" agent-hangar/mcp-data-studio python /t/smoke_mcp.py
      - name: MCP smoke test — one container per session
        run: |
          DATA_STUDIO_SANDBOX=container docker compose --profile data-studio up -d data-studio
          timeout 180 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" $(docker compose ps -q data-studio))" = healthy ]; do sleep 3; done'
          docker run --rm --network hangar_agents -v "$PWD/mcp-servers/data-studio/tests:/t" agent-hangar/mcp-data-studio python /t/smoke_mcp.py
          test "$(docker ps -q --filter label=hangar.data-studio.sandbox | wc -l)" -ge 2
      - name: Logs on failure
        if: failure()
        run: docker compose --profile data-studio logs --tail 200 data-studio
