<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Hangar · Meu espaço</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23F4B400' stroke-width='2.2' stroke-linejoin='round'><path d='M2.5 20.5V11L12 3.5 21.5 11v9.5'/><path d='M6.5 20.5v-6h11v6'/></svg>">
<link rel="manifest" href="/app/manifest.webmanifest">
<meta name="theme-color" content="#1C2530">
<link rel="apple-touch-icon" href="/app/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/ui/style.css?v=__V__">
<script>window.HANGAR_MODE = 'user';</script>
</head>
<body class="login-mode portal">
<a class="skip" href="#main">Pular para o conteúdo</a>
<aside id="side">
  <div class="brand"><span class="logo" data-i="logo"></span><span>Agent Hangar</span></div>
  <div class="gsearch"><input id="gsearch" type="search" placeholder="Buscar… (Ctrl+K)" aria-label="Buscar"></div>
  <nav aria-label="Principal">
    <div class="nav-group">
      <div class="nav-title">Meu workspace</div>
      <a href="#/" data-r="" data-i="gauge">Início</a>
      <a href="#/my-issues" data-r="my-issues" data-i="target">Minhas issues</a>
      <a href="#/issues" data-r="issues" data-i="template">Issues</a>
      <a href="#/mine" data-r="mine" data-i="bot">Meus agentes</a>
      <a href="#/org" data-r="org" data-i="briefcase">Organograma</a>
      <a href="#/decisions" data-r="decisions" data-i="approve">Decisões <span id="dec-badge" class="badge" hidden></span></a>
      <a href="#/inbox" data-r="inbox" data-i="inbox">Caixa de entrada <span id="inbox-badge" class="badge" hidden></span></a>
      <a href="#/connect-ai" data-r="connect-ai" data-i="plug">Conectar minha IA</a>
      <a href="#/access" data-r="access" data-i="lock">Meus acessos</a>
    </div>
  </nav>
  <div class="side-foot"><div id="whoami"></div><div class="row between"><span id="ver" class="small"></span><button id="logout" class="ghost on-dark" title="Sair"><span data-i="logout"></span>Sair</button></div></div>
</aside>
<main id="main" tabindex="-1"></main>
<div id="login" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/ui/i18n.js?v=__V__"></script>
<script src="/ui/icons.js?v=__V__"></script>
<script>document.querySelectorAll('[data-i]').forEach(el => el.insertAdjacentHTML('afterbegin', icon(el.dataset.i)));</script>
<script src="/ui/org.js?v=__V__"></script>
<script src="/ui/employees.js?v=__V__"></script>
<script src="/ui/plugins.js?v=__V__"></script>
<script src="/ui/work.js?v=__V__"></script>
<script src="/ui/ux.js?v=__V__"></script>
<script src="/ui/analyst.js?v=__V__"></script>
<script src="/ui/home.js?v=__V__"></script>
<script src="/ui/member.js?v=__V__"></script>
<script src="/ui/issues.js?v=__V__"></script>
<script src="/ui/app.js?v=__V__"></script>
</body>
</html>
