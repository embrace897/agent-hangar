<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Hangar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23F4B400' stroke-width='2.2' stroke-linejoin='round'><path d='M2.5 20.5V11L12 3.5 21.5 11v9.5'/><path d='M6.5 20.5v-6h11v6'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=__V__">
</head>
<body class="login-mode">
<a class="skip" href="#main">Pular para o conteúdo</a>
<aside id="side">
  <div class="brand"><span class="logo" data-i="logo"></span><span>Agent Hangar</span></div>
  <div class="gsearch"><input id="gsearch" type="search" placeholder="Buscar… (Ctrl+K)" aria-label="Buscar"></div>
  <nav aria-label="Principal">
    <div class="nav-group">
      <div class="nav-title">Dia a dia</div>
      <a href="#/hub/painel" data-r="hub-painel" data-i="gauge">Painel</a>
      <a href="#/hub/inbox" data-r="hub-inbox" data-i="inbox">Caixa de entrada <span id="inbox-badge" class="badge" hidden></span></a>
      <a href="#/hub/issues" data-r="hub-issues" data-i="template">Issues</a>
    </div>
    <div class="nav-group">
      <div class="nav-title">Força de trabalho</div>
      <a href="#/hub/agentes" data-r="hub-agentes" data-i="bot">Agentes</a>
      <a href="#/hub/employees" data-r="hub-employees" data-i="briefcase">Digital employees</a>
      <a href="#/hub/trabalho" data-r="hub-trabalho" data-i="team">Trabalho</a>
      <a href="#/hub/projetos" data-r="hub-projetos" data-i="folder">Projetos</a>
      <a href="#/hub/capacidades" data-r="hub-capacidades" data-i="puzzle">Capacidades</a>
      <a href="#/hub/conhecimento" data-r="hub-conhecimento" data-i="book">Conhecimento</a>
    </div>
    <div class="nav-group">
      <div class="nav-title">Gestão</div>
      <a href="#/hub/valor" data-r="hub-valor" data-i="chart">Valor e custo</a>
      <a href="#/hub/auditoria" data-r="hub-auditoria" data-need="auditor" data-i="scroll">Auditoria</a>
      <a href="#/hub/pessoas" data-r="hub-pessoas" data-i="userCog">Pessoas e times</a>
      <a href="#/hub/app" data-r="hub-app" data-need="admin" data-i="monitor">App Hangar</a>
      <a href="#/hub/config" data-r="hub-config" data-i="lock">Configurações</a>
    </div>
  </nav>
  <div class="side-foot"><div id="whoami"></div><a href="/app/" class="small side-portal" data-i="user">Portal do usuário</a><div class="row between"><span id="ver" class="small"></span><button id="logout" class="ghost on-dark" title="Sair"><span data-i="logout"></span>Sair</button></div></div>
</aside>
<main id="main" tabindex="-1"></main>
<div id="login" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="i18n.js?v=__V__"></script>
<script src="icons.js?v=__V__"></script>
<script>document.querySelectorAll('[data-i]').forEach(el => el.insertAdjacentHTML('afterbegin', icon(el.dataset.i)));</script>
<script src="org.js?v=__V__"></script>
<script src="employees.js?v=__V__"></script>
<script src="plugins.js?v=__V__"></script>
<script src="work.js?v=__V__"></script>
<script src="ux.js?v=__V__"></script>
<script src="analyst.js?v=__V__"></script>
<script src="member.js?v=__V__"></script>
<script src="issues.js?v=__V__"></script>
<script src="llm.js?v=__V__"></script>
<script src="connectors.js?v=__V__"></script>
<script src="skills.js?v=__V__"></script>
<script src="apphangar.js?v=__V__"></script>
<script src="app.js?v=__V__"></script>
</body>
</html>
